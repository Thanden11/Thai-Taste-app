[project]
name = "thai-taste-backend"
version = "0.1.0"
description = "Backend API for Thai Taste-App: recommender + LLM explanation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "ollama>=0.3.0",
    "accelerate>=1.13.0",
    "pymongo>=4.17.0",
    "torch==2.5.1",
    "sentence-transformers>=5.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false
torch-backend = "cu124"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
