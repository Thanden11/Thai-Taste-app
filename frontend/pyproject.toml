[project]
name = "thai-taste-frontend"
version = "0.1.0"
description = "Streamlit UI for Thai Taste-App."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
