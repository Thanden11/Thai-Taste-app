services:
  backend:
    build: ./backend
    container_name: thai-taste-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:8501
      - MONGO_URL=mongodb://mongo:27017
      - OLLAMA_URL=http://ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: thai-taste-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - APP_ENV=development
    volumes:
      - ./frontend/app.py:/app/app.py
      - ./frontend/components:/app/components
      - ./frontend/utils:/app/utils
    depends_on:
      - backend

  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: thai-taste-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  ollama:
    image: ollama/ollama:latest
    container_name: thai-taste-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: thai-taste-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        export OLLAMA_HOST=http://ollama:11434
        echo "[ollama-init] pulling gemma4:e4b (this may take a while on first run)..."
        ollama pull gemma4:e4b
        echo "[ollama-init] done."
    restart: "no"

volumes:
  mongo_data:
